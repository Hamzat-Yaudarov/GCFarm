<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GC Farm</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="player-info">
        <img id="avatar" class="player-avatar" alt="avatar" />
        <div class="balances">
          <div class="balance scube-balance"><span class="balance-label">SCube</span> <span id="scube">0</span></div>
          <div class="balance gcube-balance"><span class="balance-label">GCube</span> <span id="gcube">0</span></div>
        </div>
      </div>
      <div class="energy-panel">
        <div class="energy-bottle" aria-hidden="true"></div>
        <div class="energy-text"><span id="energy">0</span>/<span id="capacity">0</span></div>
      </div>
    </header>

    <main class="content">
      <section id="tab-home" class="tab active">
        <button id="gold-cube" class="gold-cube" aria-label="Получить SCube"></button>
        <div class="limit-note"><span>Дневной лимит: </span><span id="daily">0</span>/<span id="dailyLimit">250</span></div>
        <button id="watch-ad" class="secondary-btn">Посмотреть рекламу (энергия)</button>
      </section>

      <section id="tab-shop" class="tab">
        <div class="shop-section">
          <h2 class="section-title">Обмен</h2>
          <div class="exchange-row">
            <input id="exchange-amount" class="number-input" type="number" value="10" min="1" step="1" />
            <button id="exchange-btn" class="primary-btn">Обменять SCube → GCube</button>
          </div>
        </div>
        <div class="shop-section">
          <h2 class="section-title">Улучшения</h2>
          <div class="upgrade-card">
            <div class="upgrade-info">
              <div class="upgrade-title">Вместимость энергии +50</div>
              <div class="upgrade-cost">Стоимость: 100 SCube</div>
            </div>
            <button id="upgrade-capacity" class="primary-btn">Купить</button>
          </div>
          <div class="upgrade-card">
            <div class="upgrade-info">
              <div class="upgrade-title">Дневной лимит +50</div>
              <div class="upgrade-cost">Стоимость: <span id="limit-cost">90</span> SCube</div>
            </div>
            <button id="upgrade-limit" class="primary-btn">Купить</button>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottombar">
      <button data-tab="home" class="tab-btn active">Главная</button>
      <button data-tab="shop" class="tab-btn">Магазин</button>
    </nav>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
