<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GC Farm</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Yandex.RTB -->
  <script>window.yaContextCb=window.yaContextCb||[]</script>
  <script src="https://yandex.ru/ads/system/context.js" async></script>
</head>
<body>
  <div id="app-root" class="app-root">
    <header class="topbar">
      <div class="player-info">
        <img id="avatar" class="player-avatar" src="" alt="avatar">
        <div class="balances">
          <div class="balance-item"><span class="balance-label">SCube</span> <span id="scube" class="balance-value">0</span></div>
          <div class="balance-item"><span class="balance-label">GCube</span> <span id="gcube" class="balance-value">0</span></div>
        </div>
      </div>
    </header>

    <main id="content" class="content-area">
      <section id="tab-home" class="tab-view active">
        <div class="energy-panel">
          <div class="energy-row">
            <div class="energy-label">Энергия</div>
            <div class="energy-values"><span id="energy">0</span>/<span id="capacity">0</span></div>
          </div>
          <div class="energy-bar">
            <div id="energyFill" class="energy-fill" style="width:0%"></div>
          </div>
          <div class="daily-row">
            <div class="daily-label">Дневной лимит</div>
            <div class="daily-values"><span id="dailyUsed">0</span>/<span id="dailyLimit">0</span></div>
          </div>
        </div>

        <div class="cube-wrapper">
          <button id="goldCube" class="gold-cube" aria-label="tap for SCube"></button>
          <div id="tapHint" class="tap-hint">+1 SCube</div>
        </div>
      </section>

      <section id="tab-shop" class="tab-view">
        <div class="shop-section">
          <h2 class="section-title">Обмен валюты</h2>
          <div class="exchange-row">
            <input id="exchangeAmount" class="input-exchange" type="number" min="1" step="1" placeholder="Количество SCube">
            <button id="exchangeBtn" class="btn primary">Обменять на GCube</button>
          </div>
        </div>

        <div class="shop-section">
          <h2 class="section-title">Улучшения</h2>
          <div class="upgrade-card">
            <div class="upgrade-info">
              <div class="upgrade-title">Вместимость энергии +50</div>
              <div class="upgrade-cost">100 SCube</div>
            </div>
            <button id="upgradeCapacity" class="btn secondary">Улучшить</button>
          </div>
          <div class="upgrade-card">
            <div class="upgrade-info">
              <div class="upgrade-title">Дневной лимит +50</div>
              <div id="limitCost" class="upgrade-cost">—</div>
            </div>
            <button id="upgradeDaily" class="btn secondary">Улучшить</button>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottombar">
      <button class="tab-btn active" data-tab="home">Главная</button>
      <button class="tab-btn" data-tab="shop">Магазин</button>
    </nav>
  </div>

  <!-- Yandex.RTB R-A-17361274-1 -->
  <script>
    window.yaContextCb.push(() => {
      Ya.Context.AdvManager.render({
        "blockId": "R-A-17361274-1",
        "type": "floorAd",
        "platform": "touch"
      })
    })
  </script>

  <script src="./app.js" defer></script>
</body>
</html>
