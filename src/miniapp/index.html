<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GC Farm - MiniApp</title>
  <link rel="stylesheet" href="/miniapp/static/styles.css" />
  <script>window.ADSGRAM_CONFIG = { interstitialBlockId: 'int-15441', rewardBlockId: '15442', taskBlockId: 'task-15446' };</script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body>
  <div class="game-root">
    <header class="game-header">
      <div class="player-avatar" id="avatar">A</div>
      <div class="balances">
        <div class="balance-s">SCube: <span id="scube">0</span></div>
        <div class="balance-g">GCube: <span id="gcube">0</span></div>
      </div>
    </header>

    <main class="game-main">
      <section class="tab-content" id="home">
        <div class="cube-area">
          <button id="golden-cube" class="golden-cube" title="Нажми чтобы получить 1 SCube">🔶</button>
          <div class="energy">Энергия: <span id="energy">0</span> / <span id="energy-capacity">50</span></div>
          <div class="daily">Сегодня: <span id="daily">0</span> / <span id="daily-limit">250</span></div>
          <div class="ad-block">
            <button id="watch-ad" class="watch-ad">Смотреть рекламу (получить 5 SCube)</button>
          </div>
        </div>
      </section>

      <section class="tab-content hidden" id="store">
        <div class="store-container">
          <h3>Обмен валют</h3>
          <div class="exchange">
            <button id="scube-to-gcube" class="exchange-btn">Поменять 50 SCube → 1 GCube</button>
            <button id="gcube-to-scube" class="exchange-btn">Поменять 1 GCube → 50 SCube</button>
          </div>

          <h3>Улучшения</h3>
          <div class="upgrades">
            <div class="upgrade-card">
              <div class="upgrade-title">Увеличение вместимости энергии +50</div>
              <div class="upgrade-cost">Стоимость: 100 SCube</div>
              <button class="upgrade-btn" data-type="energy_capacity">Купить</button>
            </div>

            <div class="upgrade-card">
              <div class="upgrade-title">Увеличение дневного лимита +50</div>
              <div class="upgrade-cost">Стоимость: <span id="daily-cost">90</span> SCube (зависит от уровня)</div>
              <div class="upgrade-level">Текущий уровень: <span id="daily-level">0</span></div>
              <button class="upgrade-btn" data-type="daily_limit">Купить</button>
            </div>
          </div>

          <div class="store-feedback" id="store-feedback"></div>
        </div>
      </section>

      <section class="tab-content hidden" id="tasks">
        <div class="tasks-container">
          <h3>Задания</h3>
          <!-- adsgram-task web component will be inserted here -->
          <div id="ads-task-wrap"></div>
          <div class="task-feedback" id="task-feedback"></div>
        </div>
      </section>

    </main>

    <nav class="tabs-bottom">
      <button class="tab-button active" data-tab="home">Главная</button>
      <button class="tab-button" data-tab="store">Магазин</button>
      <button class="tab-button" data-tab="tasks">Задания</button>
    </nav>

    <div id="confirm-modal" class="confirm-modal hidden">
      <div class="confirm-box">
        <div id="confirm-message">Confirm?</div>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="confirm-btn">Отмена</button>
          <button id="confirm-ok" class="confirm-btn primary">Подтвердить</button>
        </div>
      </div>
    </div>

    <script src="/miniapp/static/app.js"></script>
  </div>
</body>
</html>
